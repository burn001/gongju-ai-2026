<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AI 에이전트에게 일 맡기기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* 틀: ALRIS 최종연구심의회 발표(burn001/alris-final-review-2026)의 관제실 틀을 그대로 씀
   1280×720 원판을 화면에 맞춰 키움 · 프로젝터용으로 글자 크기만 키움 */
:root {
  color-scheme: dark;
  --void: #05090f; --bg0: #0a1424; --bg1: #17305a;
  --ink: #eef4fb; --mu: #b4c5de; --mu2: #93a7c6; --dim: #6f83a3;
  --line: #2a4268; --panel: rgba(17, 31, 54, .86); --panel2: rgba(24, 44, 76, .75);
  --cy: #4fd1e8; --cy2: #1e4f7a; --ok: #4fd1e8; --warn: #f4b740; --bad: #ff7a66; --gr: #5fe0a0;
  --f-ui: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; --f-mono: "JetBrains Mono", Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--f-ui); margin: 0; word-break: keep-all; }
.page { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#deck { position: relative; width: 100%; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
#deck:fullscreen { background: #000; padding: 0; }
#stage { position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,.6); max-width: 100%; }
#deck:fullscreen #stage { border-radius: 0; box-shadow: none; }
#canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--mu); max-width: 100%; }
.ctl button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid #2b3f60; background: #111c2e; color: var(--ink); cursor: pointer; }
.ctl button:hover { border-color: var(--cy); }
.ctl button[aria-pressed="true"] { background: #0f3a4a; border-color: var(--cy); color: var(--cy); }
.ctl button:focus-visible, a:focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
.ctl .pos { font-family: var(--f-mono); min-width: 74px; text-align: center; }
.ctl .hint { color: var(--dim); font-size: 12px; }
@media (max-width: 600px) { .ctl .hint { display: none; } }

/* ── 장면 공통 ── */
.slide { position: absolute; inset: 0; width: 1280px; height: 720px; overflow: hidden; box-sizing: border-box;
  background: radial-gradient(ellipse at 72% -8%, var(--bg1) 0%, var(--bg0) 58%); color: var(--ink); font-family: var(--f-ui); }
.slide * { box-sizing: border-box; }
.slide::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(79,209,232,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(79,209,232,.045) 1px, transparent 1px); background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 85%); }
.slide.ch { background: radial-gradient(ellipse at 20% 50%, #123a5e 0%, #071020 62%); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.glow { text-shadow: 0 0 16px rgba(79,209,232,.55); }
.cy { color: var(--cy); } .mu { color: var(--mu); } .mu2 { color: var(--mu2); } .warn { color: var(--warn); } .bad { color: var(--bad); } .gr { color: var(--gr); }
.pn { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.pn.rel { position: relative; }
.hd { position: absolute; left: 60px; right: 60px; top: 28px; display: flex; align-items: center; gap: 16px; }
.hd .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--cy); box-shadow: 0 0 12px var(--cy); flex: none; }
.hd .eb { font: 700 16px var(--f-ui); color: var(--cy); letter-spacing: .06em; }
.hd .t { font-size: 36px; font-weight: 900; line-height: 1.25; margin-top: 2px; letter-spacing: -.015em; }
.hd .ref { margin-left: auto; align-self: flex-start; margin-top: 4px; font: 700 15px var(--f-ui); color: var(--mu2); white-space: nowrap; }
.lab { font: 700 17px var(--f-ui); color: var(--cy); letter-spacing: .04em; }
.note { position: absolute; left: 60px; right: 60px; display: flex; gap: 16px; align-items: baseline; border-top: 1px dashed #335789; padding-top: 12px; font-size: 21px; line-height: 1.5; color: #d2deee; }
.note .k { font: 700 16px var(--f-ui); color: var(--cy); letter-spacing: .04em; flex: none; }
ul.li { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
ul.li li { position: relative; padding-left: 22px; font-size: 23px; line-height: 1.45; color: #dfe8f4; }
ul.li li::before { content: ""; position: absolute; left: 0; top: .6em; width: 9px; height: 9px; border-radius: 2px; background: var(--cy); box-shadow: 0 0 6px var(--cy); }
ul.li.w li::before { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
ul.li.b li::before { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
.chip { display: inline-block; font-size: 17px; font-weight: 700; padding: 4px 14px; border-radius: 999px; border: 1px solid currentColor; }
.tag { display: inline-block; font: 700 15px var(--f-mono); padding: 3px 10px; border-radius: 5px; background: rgba(79,209,232,.14); color: var(--cy); border: 1px solid rgba(79,209,232,.5); vertical-align: middle; }
.keymsg { position: absolute; left: 60px; right: 60px; font-size: 27px; font-weight: 700; line-height: 1.45; border-left: 5px solid var(--cy); padding: 8px 0 8px 24px; background: linear-gradient(90deg, rgba(79,209,232,.14), transparent 75%); }
.shot { background: #fff; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.shot img { display: block; width: 100%; }
.cap { font-size: 17px; color: var(--mu); margin-top: 8px; line-height: 1.4; }
/* 지시(프롬프트) 상자 */
.pbox { position: absolute; border-radius: 12px; border: 1px solid rgba(79,209,232,.45); background: rgba(8, 22, 40, .92); box-shadow: 0 0 26px rgba(79,209,232,.12); padding: 18px 24px 18px; }
.pbox .pl { display: flex; align-items: center; gap: 10px; font: 700 17px var(--f-ui); color: var(--cy); margin-bottom: 10px; }
.pbox .pl i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--cy); color: #04121e; font-size: 16px; }
.pbox .pt { font-size: 23px; line-height: 1.62; color: #eef4fb; }
.pbox .pt b { color: var(--warn); font-weight: 700; }
.pbox .pt .r { display: block; padding-left: 1.1em; text-indent: -1.1em; }
/* 워크플로 그림 */
.wf-row { position: absolute; left: 60px; right: 60px; display: flex; align-items: stretch; gap: 0; }
.wf-lab { flex: none; width: 112px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; border-radius: 10px 0 0 10px; }
.wf-items { flex: 1; display: flex; gap: 12px; padding: 12px 14px; border-radius: 0 10px 10px 0; flex-wrap: nowrap; }
.wf-in .wf-lab { background: rgba(244,183,64,.18); color: var(--warn); border: 1.5px solid rgba(244,183,64,.7); border-right: 0; }
.wf-in .wf-items { border: 1.5px solid rgba(244,183,64,.7); background: rgba(244,183,64,.05); }
.wf-out .wf-lab { background: rgba(95,224,160,.16); color: var(--gr); border: 1.5px solid rgba(95,224,160,.7); border-right: 0; }
.wf-out .wf-items { border: 1.5px solid rgba(95,224,160,.7); background: rgba(95,224,160,.05); }
.wf-chip { flex: 1; font-size: 20px; line-height: 1.35; padding: 8px 12px; border-radius: 7px; background: rgba(10,20,36,.75); border: 1px solid var(--line); display: flex; align-items: center; }
.wf-steps { position: absolute; left: 60px; right: 60px; display: flex; align-items: stretch; }
.wf-step { flex: 1; min-width: 0; border: 1.5px solid var(--cy); border-radius: 10px; background: var(--bg0); box-shadow: 0 0 16px rgba(79,209,232,.18); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.wf-step .n { font: 700 16px var(--f-mono); color: var(--cy); }
.wf-step .tt { font-size: 23px; font-weight: 900; line-height: 1.25; }
.wf-step .dd { font-size: 20px; line-height: 1.4; color: var(--mu); }
.wf-step .sub2 { border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; background: rgba(79,209,232,.07); }
.wf-step .sub2 b { display: block; font-size: 19px; }
.wf-step .sub2 span { font-size: 17.5px; color: var(--mu); line-height: 1.35; display: block; }
.wf-arr { flex: none; width: 30px; display: flex; align-items: center; justify-content: center; color: var(--cy); font-size: 26px; font-weight: 900; }
.wf-down { position: absolute; left: 0; right: 0; text-align: center; color: var(--mu2); font-size: 26px; line-height: 1; }

/* 상시 겹 · 진행 바, 꼬리말, 자막 */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#prog { position: absolute; left: 0; right: 0; top: 0; height: 6px; display: flex; gap: 3px; pointer-events: auto; }
#prog .seg { position: relative; height: 100%; background: rgba(79,209,232,.14); cursor: pointer; }
#prog .seg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cy); box-shadow: 0 0 8px var(--cy); transition: width .5s ease; }
#ft { position: absolute; left: 60px; right: 60px; bottom: 14px; display: flex; justify-content: space-between; font: 500 15px var(--f-ui); color: var(--mu2); }
#ft .c { color: var(--mu2); }
#ftn { font-family: var(--f-mono); font-weight: 700; color: var(--mu); }
#sub { position: absolute; left: 120px; right: 120px; bottom: 46px; display: flex; justify-content: center; }
#sub span { display: inline-block; max-width: 1040px; text-align: center; font-size: 25px; font-weight: 500; line-height: 1.45; color: #fff;
  background: rgba(3, 8, 16, .88); border: 1px solid rgba(79,209,232,.25); padding: 8px 20px; border-radius: 6px; text-wrap: balance; word-break: keep-all;
  animation: subIn .35s ease both; }
@keyframes subIn { from { opacity: 0; transform: translateY(8px); } }

/* 장면 전환 */
.slide.enter { animation: enter .6s cubic-bezier(.2,.7,.2,1) both; }
.slide.leave { animation: leave .45s ease both; z-index: 2; }
@keyframes enter { from { opacity: 0; transform: scale(1.025); filter: blur(6px); } }
@keyframes leave { to { opacity: 0; transform: scale(.985); filter: blur(4px); } }

/* 효과: .play가 걸린 동안만 돎. 걸리지 않은 상태가 곧 완성된 정지 화면 */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes draw { from { stroke-dashoffset: var(--len, 2000); } }
@keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } }
@keyframes sweep { to { transform: rotate(360deg); } }
.play .a-rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-fade { animation: fade .8s ease both; animation-delay: var(--d, 0s); }
.play .a-grow { transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-draw { stroke-dasharray: var(--len, 2000); animation: draw 1.4s ease both; animation-delay: var(--d, 0s); }
.play .a-wipe { animation: wipe .9s cubic-bezier(.6,0,.2,1) both; animation-delay: var(--d, 0s); }
.play .a-pop { animation: pop .55s cubic-bezier(.3,1.3,.5,1) both; animation-delay: var(--d, 0s); }
.a-pulse { animation: pulse 2.4s ease-in-out infinite; }
.lpdot { transform-origin: 250px 230px; animation: sweep 6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .play *, .slide.enter, .slide.leave, .a-pulse, .lpdot, #sub span { animation: none !important; } }

.lnk { font: 700 16px var(--f-ui); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--cy); background: rgba(79,209,232,.12); color: var(--cy); cursor: pointer; text-decoration: none; }
.lnk:hover { background: rgba(79,209,232,.25); }
.slide a { color: inherit; }
.slide a.cy { color: var(--cy); }
</style>
<style>
/* 11.10. 개편: 일하는 순서 그림의 담당 표시, 큰 지시 상자, 주소창 모양, 발표자 전용 표시 */
.who { display: inline-block; font: 700 14px var(--f-ui); padding: 1px 9px; border: 1px solid currentColor; border-radius: 999px; margin-left: 8px; vertical-align: 2px; letter-spacing: 0; }
.pbox.big .pt { font-size: 28px; line-height: 1.6; }
.pbox.big .pt .r { padding-left: 1.05em; text-indent: -1.05em; }
.addr { display: flex; align-items: center; gap: 14px; background: #f4f8fc; border-radius: 999px; padding: 12px 26px; color: #0a1424; box-shadow: inset 0 0 0 3px rgba(79,209,232,.9), 0 0 24px rgba(79,209,232,.35); }
.addr .ic { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 3px solid #5a6b85; position: relative; }
.addr .ic::after { content: ""; position: absolute; width: 11px; height: 3px; background: #5a6b85; right: -9px; bottom: -4px; transform: rotate(45deg); border-radius: 2px; }
.addr .u { font-family: var(--f-mono); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.cutmark { position: absolute; left: 50%; transform: translateX(-50%); top: 10px; white-space: nowrap; z-index: 4; display: none; font: 700 13px var(--f-ui); color: var(--warn); background: rgba(40,30,8,.85); border: 1px solid rgba(244,183,64,.6); border-radius: 5px; padding: 2px 8px; }
body.pres .cutmark { display: block; }
.bar { height: 20px; border-radius: 4px; }
#tt { position: absolute; inset: 0; z-index: 8; display: none; background: radial-gradient(ellipse at 72% -8%, #13284a 0%, #070e1a 60%); color: var(--ink); font-family: var(--f-ui); }
#tt.on { display: block; }
#tt table { border-collapse: collapse; width: 100%; }
#tt td, #tt th { text-align: left; padding: 5px 8px; border-bottom: 1px solid #22385a; font-size: 17px; line-height: 1.35; vertical-align: top; }
#tt th { font-size: 14px; color: var(--cy); font-weight: 700; }
#tt td.t { font-family: var(--f-mono); color: var(--cy); white-space: nowrap; }
#tt td.m, #tt td.n { font-family: var(--f-mono); color: var(--mu2); white-space: nowrap; font-size: 15px; }
#tt tr.cut td:nth-child(2) b { color: var(--warn); }
</style>
</head>
<body>
<div class="page">
  <div id="deck">
    <div id="stage" aria-live="polite"><div id="canvas"><div id="layer"></div>
      <div id="hud"><div id="prog"></div><div id="sub" hidden></div><div id="ft"><span id="ftl"></span><span class="c" id="ftc"></span><span id="ftn"></span></div></div>
      <div id="tt" aria-hidden="true"></div>
    </div></div>
  </div>
  <div class="ctl" role="toolbar" aria-label="발표 조작">
    <button id="bPrev" type="button" aria-label="이전 장면">← 이전</button>
    <span class="pos" id="pos"></span>
    <button id="bNext" type="button" aria-label="다음 장면">다음 →</button>
    <button id="bAuto" type="button" aria-pressed="false">▶ 자동 재생(해설 자막)</button>
    <button id="bReplay" type="button">효과 다시 보기</button>
    <button id="bFull" type="button">전체 화면</button>
    <span class="hint">← → 넘기기 · A 자동 재생 · R 효과 · F 전체 화면</span>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   공주여성새로일하기센터 AI 리터러시 제고교육 · AI 에이전트 활용(2시간)
   2026. 11. 10.·11. 17.(화), 10:00
   11. 10. 개편: 본 흐름 '공주 일자리 이야기'(S4 → S1·S7 → S4 공개 → S9 → S8 → S2·S3 → S5).
   시나리오마다 상황 → 발표용 지시 → 일하는 순서 → 결과 화면 → 함께 보기·투표.
   결과물 그림은 recordings/와 실험 폴더의 리허설 화면(2026. 11. 7.～9.)에서 가져옴.
   ALRIS 수치는 최종연구심의회 발표(보고서 v13, 2026. 11. 8.)에서 가져옴.
   발표자 전용: P 줄임 표시(⏱) 켜기·끄기, T 시간표. 주소 끝 ?p 로 열면 줄임 표시가 켜진 채 시작.
   ════════════════════════════════════════════════════════════ */
const DAY = "2026. 11. 10.·11. 17.(화)";
const ROOM = "ai-agent-gongju.pages.dev/room";
const CH = ["시작", "강사 소개 · ALRIS", "챗봇과 에이전트", "리서치 → 발표 자료", "공주 일자리 지도", "일하는 엄마 지도", "쉬는 시간", "맞춤 지원서", "설문 · CEO 대시보드", "여러분의 목소리", "마무리"];
const CUT1 = "① 늦으면 녹화본 3분 또는 건너뛰기", CUT2 = "② 늦으면 결과 화면만", CUT3 = "③ 늦으면 S4 지도 공개에 합침";
const d = (s) => `data-d="${(+s).toFixed(2)}"`;
function hd(s, title) {
  return `<div class="hd"><span class="dot a-pulse"></span><div><div class="eb">${s.eb || CH[s.ch]}</div><div class="t a-rise" ${d(.05)}>${title}</div></div><span class="ref">${s.ref || ""}</span></div>`;
}
function chCard(no, label, title, items) {
  return () => `<div class="slide ch">
    <div class="a-fade" ${d(.05)} style="position:absolute;left:120px;top:190px;font-size:22px;font-weight:700;letter-spacing:.2em;color:var(--cy)">${label}</div>
    <div class="a-wipe" ${d(.2)} style="position:absolute;left:116px;top:228px;font-size:72px;font-weight:900;letter-spacing:-.02em;line-height:1.2;white-space:nowrap">${title}</div>
    <div class="a-grow" ${d(.6)} style="position:absolute;left:120px;top:344px;width:220px;height:4px;background:var(--cy);box-shadow:0 0 12px var(--cy)"></div>
    <div style="position:absolute;left:120px;top:378px;display:flex;flex-direction:column;gap:14px">${items.map((t, i) => `<div class="a-rise" ${d(.8 + i * .12)} style="font-size:27px;color:var(--mu)"><span class="mono cy" style="font-size:19px;margin-right:16px">${String(i + 1).padStart(2, "0")}</span>${t}</div>`).join("")}</div>
    <div class="mono a-fade" ${d(.3)} style="position:absolute;right:100px;top:130px;font-size:320px;font-weight:700;color:rgba(79,209,232,.08);line-height:1">${no}</div>
  </div>`;
}
/* 일하는 순서 그림: 입력 → 단계들 → 결과물. 단계마다 누가 하는지(who) 표시 */
const WHO = { ai: ["AI가 판단", "var(--cy)"], prog: ["프로그램", "var(--gr)"], chk: ["검사 담당", "var(--warn)"], ppl: ["여러분", "#ff9ec7"], run: ["자동", "var(--mu2)"] };
function wf(o) {
  const yIn = o.yIn || 120, hIn = o.hIn || 88, ySt = yIn + hIn + 34, hSt = o.hSt || 230, yOut = ySt + hSt + 34, hOut = o.hOut || 88;
  const steps = o.steps.map((st, i) => {
    const body = st.par ? st.par.map((p) => `<div class="sub2"><b>${p[0]}</b><span>${p[1]}</span></div>`).join("") : `<div class="dd">${st.d}</div>`;
    const w = st.who ? `<span class="who" style="color:${WHO[st.who][1]}">${WHO[st.who][0]}</span>` : "";

/* ════════════ 발표자 시간표(T 키) ════════════ */
const TT = [["0:00", "입장 · 아바타, 첫 투표 \"AI를 어디에 써 보셨나요?\"", 10, 0], ["0:10", "강사 소개, ALRIS", 12, 1], ["0:22", "챗봇 vs 에이전트 + <b>S4 출발</b>(수집 장면 함께 보기)", 10, 2], ["0:32", "S1 리서치 → S7 발표 슬라이드 <b>②</b>", 15, 3, 1], ["0:47", "S4 분석 · 지도 공개(투표: 가장 많은 일자리? 몇 %?)", 12, 4], ["0:59", "S9 일하는 엄마 지도 <b>③</b>", 7, 5, 1], ["1:06", "쉬는 시간(S6 홍보영상 틀어 두기)", 5, 6], ["1:11", "S8 공고 투표 → 맞춤 지원서", 10, 7], ["1:21", "S2 · S3 설문 · CEO 대시보드 <b>①</b>", 12, 8, 1], ["1:33", "S5 여러분의 목소리(채팅 → 분석)", 10, 9], ["1:43", "마무리 레슨, 자료 받기(이메일), 질문", 15, 10]];
function buildTT() {
  const st = CH.map((_, c) => S.findIndex((x) => x.ch === c)), n = CH.map((_, c) => S.filter((x) => x.ch === c).length);
  return `<div style="position:absolute;left:44px;top:26px;font-size:15px;font-weight:700;color:var(--cy);letter-spacing:.06em">발표자 전용 · T 닫기 · P 줄임 표시(⏱) 켜기/끄기</div>
  <div style="position:absolute;left:44px;top:48px;font-size:30px;font-weight:900">시간표 — 공주 일자리 이야기 (2시간)</div>
  <div style="position:absolute;left:44px;top:100px;width:720px"><table><tr><th>시각</th><th>꼭지</th><th>분</th><th>장</th></tr>
    ${TT.map((r) => `<tr class="${r[4] ? "cut" : ""}"><td class="t">${r[0]}</td><td>${r[1]}</td><td class="m">${r[2]}</td><td class="n">${st[r[3]] + 1}～${st[r[3]] + n[r[3]]}</td></tr>`).join("")}</table></div>
  <div style="position:absolute;left:800px;right:40px;top:100px;display:flex;flex-direction:column;gap:12px">
    <div class="pn rel" style="padding:12px 16px;border-color:var(--warn)"><div class="lab" style="color:var(--warn);font-size:15px">늦으면 줄이는 순서</div>
      <div style="font-size:16.5px;line-height:1.55;margin-top:4px">① S2 · S3 → 녹화본 3분 또는 건너뛰기<br>② S7 → 결과 화면만<br>③ S9 → S4 지도 공개에 합침</div></div>
    <div class="pn rel" style="padding:12px 16px"><div class="lab" style="font-size:15px">강의 전 · 진행 팁</div>
      <ul class="li" style="gap:5px;margin-top:6px">${["러너 켜기 → 점검 화면 localhost:8790 확인, AI 작업 화면 세션 연결", "크롬 '로컬 네트워크 접근' 허용(강의 사이트 [실행] 버튼)", "09시 전 S8 공고 마감 확인: scenarios/s8/check_open.py → [마감?]이면 투표에서 빼기", "S4 진행 화면: ← → 단계 · R 결과 · M 지도 · 막히면 D(어제 기록) · 러너 꺼지면 ?demo", "강의 직전 실행 기록(runs) 비우지 않기 — S3 · S7이 앞 결과를 씀"].map((x) => `<li style="font-size:15.5px;line-height:1.4">${x}</li>`).join("")}</ul></div>
  </div>`;
}

/* ════════════ 재생 엔진(틀 그대로 + 발표자 표시) ════════════ */
const layer = document.getElementById("layer"), canvas = document.getElementById("canvas"), stage = document.getElementById("stage"), deck = document.getElementById("deck");
const subEl = document.getElementById("sub"), RM = matchMedia("(prefers-reduced-motion: reduce)"), ttEl = document.getElementById("tt");
let cur = -1, auto = false, timers = [];
document.getElementById("ftl").textContent = "공주여성새로일하기센터 · AI 에이전트 활용 · " + DAY;
const prog = document.getElementById("prog");
const chStart = CH.map((_, c) => S.findIndex((x) => x.ch === c));
const chCount = CH.map((_, c) => S.filter((x) => x.ch === c).length);
prog.innerHTML = CH.map((c, i) => `<div class="seg" data-ch="${i}" title="${c}" style="flex:${chCount[i]}"><i></i></div>`).join("");
prog.addEventListener("click", (e) => { const sg = e.target.closest(".seg"); if (sg) { stopAuto(); go(chStart[+sg.dataset.ch]); } });
ttEl.innerHTML = buildTT();
let pres = /[?&]p(=|&|$)/.test(location.search);
try { if (!pres && localStorage.getItem("gongjuDeckPres") === "1") pres = true; } catch (e) {}
document.body.classList.toggle("pres", pres);
function togglePres() { pres = !pres; document.body.classList.toggle("pres", pres); try { localStorage.setItem("gongjuDeckPres", pres ? "1" : "0"); } catch (e) {} }
function toggleTT(on) { const v = on === undefined ? !ttEl.classList.contains("on") : on; ttEl.classList.toggle("on", v); ttEl.setAttribute("aria-hidden", v ? "false" : "true"); }

function prep(root) { root.querySelectorAll("[data-d]").forEach((el) => el.style.setProperty("--d", el.dataset.d + "s")); }
function play(sl) {
  if (!sl) return; clearTimeout(sl._end); sl.classList.remove("play");
  if (RM.matches || document.hidden) return;
  void sl.offsetWidth; sl.classList.add("play");
  sl._end = setTimeout(() => { sl.classList.remove("play"); }, 4600);
}
function go(i) {
  i = Math.max(0, Math.min(S.length - 1, i)); if (i === cur && layer.firstElementChild) return;
  const old = layer.querySelector(".slide:not(.leave)");
  if (old) { old.classList.remove("enter", "play"); old.classList.add("leave"); setTimeout(() => old.remove(), 460); }
  cur = i; const sc = S[i];
  const w = document.createElement("div"); w.innerHTML = sc.html(sc); const sl = w.firstElementChild;
  if (sc.cut) { const c = document.createElement("div"); c.className = "cutmark"; c.textContent = "⏱ 줄일 수 있음 · " + sc.cut; sl.appendChild(c); }
  layer.appendChild(sl); prep(sl);
  if (!RM.matches) sl.classList.add("enter");
  play(sl);
  document.getElementById("ftc").textContent = CH[sc.ch];
  document.getElementById("ftn").textContent = String(i + 1).padStart(2, "0") + " / " + S.length;
  document.getElementById("pos").textContent = (i + 1) + " / " + S.length;
  prog.querySelectorAll(".seg").forEach((sg, c) => { const st = chStart[c], n = chCount[c]; sg.firstElementChild.style.width = (i >= st + n ? 100 : i < st ? 0 : ((i - st + 1) / n * 100)) + "%"; });
  try { history.replaceState(null, "", location.search + "#s" + (i + 1)); } catch (e) { location.hash = "s" + (i + 1); }
  if (auto) runAuto();
}
function clearT() { timers.forEach(clearTimeout); timers = []; }
function runAuto() {
  clearT(); const sc = S[cur], lines = sc.sub || [];
  let t = sc.chap ? 500 : 1100;
  subEl.hidden = false; subEl.innerHTML = "";
  lines.forEach((ln) => { const len = Math.max(2600, ln.length * 145); timers.push(setTimeout(() => { subEl.innerHTML = `<span>${ln}</span>`; }, t)); t += len; });
  t += sc.chap ? 600 : 1400;
  if (sc.dur) t = Math.max(t, sc.dur * 1000);
  timers.push(setTimeout(() => { subEl.innerHTML = ""; if (cur < S.length - 1) go(cur + 1); else stopAuto(); }, t));
}
function startAuto() { auto = true; bAuto.setAttribute("aria-pressed", "true"); bAuto.textContent = "❚❚ 자동 재생 멈춤"; runAuto(); }
function stopAuto() { auto = false; clearT(); subEl.hidden = true; subEl.innerHTML = ""; bAuto.setAttribute("aria-pressed", "false"); bAuto.textContent = "▶ 자동 재생(해설 자막)"; }
const bAuto = document.getElementById("bAuto");
bAuto.onclick = () => auto ? stopAuto() : startAuto();
document.getElementById("bPrev").onclick = () => { stopAuto(); go(cur - 1); };
document.getElementById("bNext").onclick = () => { stopAuto(); go(cur + 1); };
document.getElementById("bReplay").onclick = () => play(layer.querySelector(".slide:not(.leave)"));
function toggleFull() { try { if (document.fullscreenElement) document.exitFullscreen(); else deck.requestFullscreen().catch(() => {}); } catch (e) {} }
document.getElementById("bFull").onclick = toggleFull;
function fit() {
  const full = document.fullscreenElement === deck;
  const aw = full ? innerWidth : deck.clientWidth, ah = full ? innerHeight : Math.max(200, innerHeight - 90);
  const k = Math.min(aw / 1280, ah / 720);
  stage.style.width = 1280 * k + "px"; stage.style.height = 720 * k + "px"; canvas.style.transform = `scale(${k})`;
}
addEventListener("resize", fit); document.addEventListener("fullscreenchange", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(deck);
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("button, a") && (e.key === "Enter" || e.key === " ")) return;
  const k = e.key;
  if (k === "t" || k === "T") { toggleTT(); return; }
  if (k === "p" || k === "P") { togglePres(); return; }
  if (ttEl.classList.contains("on") && k === "Escape") { toggleTT(false); return; }
  if (k === "ArrowRight" || k === "PageDown" || k === "Enter") { e.preventDefault(); stopAuto(); go(cur + 1); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); stopAuto(); go(cur - 1); }
  else if (k === "Home") { stopAuto(); go(0); } else if (k === "End") { stopAuto(); go(S.length - 1); }
  else if (k === " " || k === "a" || k === "A") { e.preventDefault(); auto ? stopAuto() : startAuto(); }
  else if (k === "f" || k === "F") toggleFull();
  else if (k === "r" || k === "R") play(layer.querySelector(".slide:not(.leave)"));
  else if (k === "Escape" && auto) stopAuto();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) { const sl = layer.querySelector(".slide"); if (sl) sl.classList.remove("play"); } });
function fromHash() { const m = /^#s(\d+)$/.exec(location.hash); return m ? +m[1] - 1 : 0; }
addEventListener("hashchange", () => { const i = fromHash(); if (i !== cur) go(i); });
fit(); go(fromHash());
</script>
